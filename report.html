<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งเหตุออนไลน์ | สารวัตรนักเรียน</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'media', theme: { extend: { fontFamily: { kanit: ['Kanit'], prompt: ['Prompt'] } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-kanit">

    <nav class="w-full p-4 relative z-10">
        <a href="/" class="inline-flex items-center gap-2 text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 px-5 py-2.5 rounded-full shadow-sm border border-slate-200 dark:border-slate-700 hover:text-red-600 transition-colors">
            <i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก
        </a>
    </nav>

    <main class="max-w-2xl mx-auto p-4 pt-8">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-red-100 dark:bg-red-500/20 text-red-600 dark:text-red-400 rounded-3xl flex items-center justify-center text-4xl mx-auto mb-5 shadow-lg"><i class="fa-solid fa-bullhorn"></i></div>
            <h1 class="text-3xl md:text-4xl font-prompt font-bold mb-2">แจ้งเหตุออนไลน์</h1>
            <p class="text-slate-500 dark:text-slate-400">พบเหตุทะเลาะวิวาทหรืออุบัติเหตุ แจ้งสารวัตรตรวจสอบทันที</p>
        </div>

        <div class="bg-white dark:bg-slate-800 p-6 md:p-8 rounded-[2rem] shadow-xl border-t-4 border-red-500">
            <form id="report-form" class="space-y-6">
                <!-- Location & GPS -->
                <div>
                    <label class="block mb-2 font-medium">สถานที่เกิดเหตุ <span class="text-red-500">*</span></label>
                    <div class="flex gap-2">
                        <input type="text" id="location" required class="flex-1 px-5 py-4 rounded-xl bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/20 transition-all dark:text-white" placeholder="ระบุสถานที่">
                        <button type="button" onclick="getGPS()" class="px-5 bg-blue-50 dark:bg-blue-500/20 text-blue-600 dark:text-blue-400 rounded-xl border border-blue-200 dark:border-blue-500/30 hover:bg-blue-100 transition-colors flex-shrink-0" id="gps-btn" title="ดึงพิกัด GPS"><i class="fa-solid fa-location-crosshairs text-xl"></i></button>
                    </div>
                    <input type="hidden" id="gps-coords">
                </div>

                <!-- Camera/Image -->
                <div>
                    <label class="block mb-2 font-medium">ภาพประกอบ (ถ่ายรูปเกิดเหตุ)</label>
                    <div class="relative">
                        <input type="file" id="image-file" accept="image/*" capture="environment" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="previewImage(this)">
                        <div class="w-full py-8 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-600 flex flex-col items-center justify-center text-slate-500 bg-slate-50 dark:bg-slate-700/30 hover:bg-slate-100 transition-colors">
                            <i class="fa-solid fa-camera text-3xl mb-3 text-red-400"></i>
                            <span id="img-status" class="font-medium text-red-500">คลิกเพื่อเปิดกล้อง หรือเลือกรูปภาพ</span>
                        </div>
                    </div>
                    <img id="img-preview" src="" class="hidden w-full h-56 object-cover rounded-xl mt-4 border border-slate-200 dark:border-slate-700 shadow-sm">
                </div>

                <div>
                    <label class="block mb-2 font-medium">รายละเอียด <span class="text-red-500">*</span></label>
                    <textarea id="details" required rows="4" class="w-full px-5 py-4 rounded-xl bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/20 transition-all dark:text-white" placeholder="อธิบายสิ่งที่เกิดขึ้น..."></textarea>
                </div>

                <button type="submit" id="submit-btn" class="w-full py-4 rounded-xl bg-red-600 text-white font-bold text-lg hover:bg-red-700 shadow-[0_4px_15px_rgba(239,68,68,0.4)] transition-all flex items-center justify-center gap-2 group">
                    <i class="fa-solid fa-paper-plane group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i> ส่งข้อมูลแจ้งเหตุ
                </button>
            </form>
        </div>
    </main>

    <!-- Firebase SDK (Modular v11.6.1) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTHk57HCEZgn8ydldHjOaFxVgy1Xtlpk8",
            authDomain: "sarawatdc.firebaseapp.com",
            projectId: "sarawatdc",
            messagingSenderId: "403581597525",
            appId: "1:403581597525:web:6fd3f19a881a0ca42661dc"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Google Apps Script Web App URL
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxQpKRlYoeM9u8epd6U-sDHZp3QMddu7q0vyyC61toIhWdex5SiebhTSXot-lawS_A/exec";
        let selectedFile = null;

        // GPS Function
        window.getGPS = () => {
            const btn = document.getElementById('gps-btn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xl"></i>';
            navigator.geolocation.getCurrentPosition(
                (pos) => { 
                    document.getElementById('gps-coords').value = `${pos.coords.latitude},${pos.coords.longitude}`; 
                    btn.innerHTML = '<i class="fa-solid fa-check text-green-600 dark:text-green-400 text-xl"></i>'; 
                    btn.classList.replace('bg-blue-50', 'bg-green-50'); 
                    btn.classList.replace('dark:bg-blue-500/20', 'dark:bg-green-500/20'); 
                },
                (err) => { 
                    btn.innerHTML = '<i class="fa-solid fa-xmark text-red-600 text-xl"></i>'; 
                    Swal.fire('Error', 'กรุณาอนุญาตการเข้าถึงตำแหน่งพิกัด', 'error'); 
                }
            );
        };

        // Image Preview
        window.previewImage = (input) => {
            if(input.files && input.files[0]) {
                selectedFile = input.files[0];
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.getElementById('img-preview');
                    img.src = e.target.result; img.classList.remove('hidden');
                    document.getElementById('img-status').innerText = 'แนบรูปแล้ว (แตะเพื่อเปลี่ยนรูป)';
                }
                reader.readAsDataURL(selectedFile);
            }
        };

        // Upload to Drive via Apps Script
        async function uploadImageToDrive(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async () => {
                    const base64 = reader.result.split(',')[1];
                    try {
                        const response = await fetch(GAS_WEBAPP_URL, {
                            method: "POST",
                            body: JSON.stringify({ filename: file.name, mimeType: file.type, base64: base64 })
                        });
                        const result = await response.json();
                        if(result.success) resolve(result.viewUrl);
                        else reject(result.error);
                    } catch(e) { reject("อัปโหลดรูปล้มเหลว โปรดลองอีกครั้ง"); }
                };
                reader.onerror = () => reject("อ่านไฟล์ไม่สำเร็จ");
                reader.readAsDataURL(file);
            });
        }

        // Submit Form
        document.getElementById('report-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn'); const origText = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังอัปโหลดข้อมูล...';

            try {
                let imageUrl = "";
                if(selectedFile) {
                    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> อัปโหลดรูปลงระบบ Drive...';
                    imageUrl = await uploadImageToDrive(selectedFile);
                }

                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึกข้อมูล...';
                await addDoc(collection(db, "reports"), {
                    type: "แจ้งเหตุฉุกเฉิน",
                    location: document.getElementById('location').value,
                    details: document.getElementById('details').value,
                    gps: document.getElementById('gps-coords').value,
                    imageUrl: imageUrl,
                    status: 'pending',
                    createdAt: serverTimestamp()
                });

                Swal.fire({ title: 'สำเร็จ', text: 'ข้อมูลส่งถึงสารวัตรแล้ว', icon: 'success' }).then(()=> { window.location.href = "/"; });
            } catch (error) { Swal.fire('ล้มเหลว', error.toString(), 'error'); } 
            finally { btn.disabled = false; btn.innerHTML = origText; }
        });
    </script>
</body>
</html>
